[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "appuesta-core"
version = "0.1.0"
description = "Shared Liga MX analysis model for the CLI and Cloudflare Worker"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

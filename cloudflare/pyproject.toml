[project]
name = "appuesta-cloudflare"
version = "0.1.0"
description = "Private APPuesta dashboard on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = ["appuesta-core"]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv.sources]
appuesta-core = { path = "../backend/dist/appuesta_core-0.1.0-py3-none-any.whl" }
